# ─────────────────────────────────────────────────────────────
#  Netlify configuration — Ahmed Mokbel Portfolio
#  Static site (HTML / CSS / JS) + Netlify Forms
# ─────────────────────────────────────────────────────────────
#
#  ⚠️  NOT ACTIVE ON THE LIVE SITE.
#  The portfolio is hosted on GitHub Pages, which ignores this file
#  completely. Nothing below is sent as an HTTP header today.
#  Kept only as a reference for a future Netlify/Cloudflare deploy.
#
#  What is actually enforced live is the <meta> subset that build.py
#  injects into every page (Content-Security-Policy + Referrer-Policy
#  + robots). See docs/agent-readiness.md §1 for the full breakdown of
#  what GitHub Pages can and cannot enforce.
# ─────────────────────────────────────────────────────────────

[build]
  publish = "."

# ── Security headers (all routes) ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://ahmed-contact-endpoint.ahmed01068775125.workers.dev; manifest-src 'self'; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Single-file build: its CSS/JS are inlined by build.py ────
#  This is the only page that needs 'unsafe-inline' for scripts.
[[headers]]
  for = "/standalone.html"
  [headers.values]
    X-Robots-Tag = "index, follow, max-image-preview:large"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; media-src 'self'; frame-src https://www.youtube-nocookie.com https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://ahmed-contact-endpoint.ahmed01068775125.workers.dev; manifest-src 'self'; upgrade-insecure-requests"

# ── Long-lived static assets ─────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ── HTML always revalidates so content updates appear instantly ─
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Correct MIME types ───────────────────────────────────────
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

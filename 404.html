<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>الصفحة غير موجودة — أحمد مقبل</title>
  <meta name="description" content="الصفحة التي تبحث عنها غير موجودة. عُد إلى الصفحة الرئيسية أو تصفّح أعمال أحمد مقبل.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=12">

  <style>
    .error-page {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(1.5rem, 5vw, 4rem);
      overflow: hidden;
      isolation: isolate;
    }

    .error-page::before,
    .error-page::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      filter: blur(10px);
      pointer-events: none;
    }

    .error-page::before {
      inset-block-start: -20%;
      inset-inline-start: 50%;
      width: min(90vw, 780px);
      aspect-ratio: 1;
      transform: translateX(50%);
      background: radial-gradient(circle, rgba(124, 58, 237, 0.22), transparent 65%);
    }

    .error-page::after {
      inset-block-end: -30%;
      inset-inline-end: -10%;
      width: min(70vw, 520px);
      aspect-ratio: 1;
      background: radial-gradient(circle, rgba(34, 211, 238, 0.12), transparent 68%);
    }

    .error-card {
      width: min(100%, 44rem);
      text-align: center;
    }

    .error-brand {
      display: inline-flex;
      margin-bottom: clamp(2rem, 6vw, 3.4rem);
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(5.5rem, 22vw, 11rem);
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #c4b5fd 0%, #8b5cf6 45%, #22d3ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .error-kicker {
      margin-top: 1.4rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .error-card h1 {
      margin-top: 0.7rem;
      font-size: clamp(1.7rem, 4.6vw, 2.6rem);
      line-height: 1.35;
    }

    .error-card > p {
      margin: 1rem auto 0;
      max-width: 34rem;
      color: var(--muted);
      line-height: 1.9;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .error-help {
      margin-top: 2.2rem;
      font-size: 0.86rem;
      color: var(--dim);
    }

    .error-help a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .error-help a:hover {
      color: var(--cyan);
    }

    @media (max-width: 420px) {
      .error-actions .btn {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- SVG sprite for the arrow icon -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5M11 18l-6-6 6-6"/>
    </symbol>
  </svg>

  <main class="error-page" id="main">
    <div class="error-card">
      <a href="/" class="brand error-brand" aria-label="أحمد مقبل — الرئيسية">
        <span class="brand__mark" aria-hidden="true">AM</span>
        <span>أحمد مقبل</span>
      </a>

      <div class="error-code" aria-hidden="true">404</div>
      <p class="error-kicker">// الصفحة غير موجودة</p>
      <h1>يبدو أنك خرجت عن المسار</h1>
      <p>
        الرابط الذي فتحته غير صحيح أو أن الصفحة تم نقلها. لا تقلق — كل الأعمال
        ما زالت في مكانها، ويمكنك العودة من هنا.
      </p>

      <div class="error-actions">
        <a href="/" class="btn btn--primary">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg>
          العودة للرئيسية
        </a>
        <a href="/#work" class="btn btn--ghost">تصفّح الأعمال</a>
      </div>

      <p class="error-help">
        تحتاج مساعدة مباشرة؟
        <a href="mailto:ahmed01068775125@gmail.com">راسلني بالبريد</a>
        أو
        <a href="https://wa.me/201228084197" target="_blank" rel="noopener noreferrer">واتساب</a>.
      </p>
    </div>
  </main>

</body>
</html>
